<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HrX_Mehra_Lab Water Management System</title>
    <!-- MQTT Over WebSockets Client Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --panel-bg: #0d1117;
            --border-color: #30363d;
            --accent-blue: #58a6ff;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            animation: pageOpenScale 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes pageOpenScale {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.96);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
        }

        header h1.rainbow-text {
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: -0.01em;
            word-break: break-word;
            line-height: 1.3;
            background: linear-gradient(
                90deg, 
                #ff0000, 
                #ff7f00, 
                #ffff00, 
                #00ff00, 
                #00ffff, 
                #0000ff, 
                #8b00ff, 
                #ff0000
            );
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: rainbowShift 3s linear infinite;
        }

        @keyframes rainbowShift {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .status-stack {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.825rem;
        }

        .split-bar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            padding: 0;
            overflow: hidden;
        }

        .split-cell {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px 10px;
            text-align: center;
        }

        .split-cell:first-child {
            border-right: 1px solid var(--border-color);
        }

        .split-sublabel {
            font-size: 0.7rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            margin-bottom: 3px;
        }

        .split-subval {
            font-size: 0.88rem;
            font-weight: 700;
        }

        .status-label {
            color: var(--text-muted);
            font-weight: 500;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            font-weight: 600;
        }

        .status-dot {
            height: 9px;
            width: 9px;
            border-radius: 50%;
            display: inline-block;
            background-color: var(--accent-red);
            margin-right: 8px;
            transition: border-color 0.3s ease, color 0.3s ease, opacity 0.3s ease;
        }

        .status-dot.connected {
            background-color: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green);
            animation: pulse-glow 1.8s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0% { transform: scale(0.95); opacity: 0.7; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.7; }
        }

        .btn-check {
            background: rgba(88, 166, 255, 0.14);
            color: var(--accent-blue);
            border: 1px solid rgba(88, 166, 255, 0.45);
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-check:hover {
            background: rgba(88, 166, 255, 0.28);
            transform: translateY(-1px);
        }

        .btn-check:active {
            transform: translateY(1px);
        }

        .grid-monitor {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .monitor-panel {
            text-align: center;
            background: var(--panel-bg);
            padding: 16px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
            transition: border-color 0.4s ease, box-shadow 0.4s ease, transform 0.2s ease;
        }

        .monitor-panel:hover {
            transform: translateY(-2px);
        }

        .monitor-label {
            font-size: 0.78rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }

        .monitor-value {
            font-size: 1.15rem;
            font-weight: 700;
            margin-top: 4px;
            transition: color 0.3s ease;
            position: relative;
            z-index: 2;
        }

        .time-readout-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed var(--border-color);
        }

        .time-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .time-sublabel {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .time-subvalue {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--accent-blue);
            margin-top: 2px;
        }

        .side-rgb {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #484f58;
            opacity: 0.3;
            transition: all 0.4s ease;
        }

        .side-rgb.left { left: 16px; }
        .side-rgb.right { right: 16px; }

        .monitor-panel.state-idle .side-rgb {
            background: #38bdf8;
            opacity: 0.8;
            animation: rgbBreathe 3s infinite ease-in-out;
        }

        @keyframes rgbBreathe {
            0%, 100% { transform: translateY(-50%) scale(0.85); box-shadow: 0 0 4px rgba(56, 189, 248, 0.4); }
            50% { transform: translateY(-50%) scale(1.15); box-shadow: 0 0 12px rgba(56, 189, 248, 0.9); }
        }

        .monitor-panel.state-running {
            border-color: rgba(56, 189, 248, 0.4);
            box-shadow: inset 0 0 16px rgba(56, 189, 248, 0.1);
        }

        .monitor-panel.state-running .side-rgb {
            opacity: 1;
            animation: none;
            background: #38bdf8;
            box-shadow: 0 0 6px rgba(56, 189, 248, 0.45);
        }

        .monitor-panel.state-running .side-rgb.right {
            animation-delay: -1s;
        }

        @keyframes rgbSpectrumWave {
            0% {
                background: #00f2fe;
                box-shadow: 0 0 10px #00f2fe, 0 0 20px #00f2fe;
                transform: translateY(-50%) scale(0.9);
            }
            33% {
                background: #38ef7d;
                box-shadow: 0 0 12px #38ef7d, 0 0 22px #38ef7d;
                transform: translateY(-50%) scale(1.3);
            }
            66% {
                background: #ff007f;
                box-shadow: 0 0 12px #ff007f, 0 0 22px #ff007f;
                transform: translateY(-50%) scale(0.9);
            }
            100% {
                background: #00f2fe;
                box-shadow: 0 0 10px #00f2fe, 0 0 20px #00f2fe;
                transform: translateY(-50%) scale(0.9);
            }
        }

        .monitor-panel.state-error .side-rgb {
            background: var(--accent-red);
            opacity: 1;
            animation: none;
        }

        @keyframes rgbAlert {
            0%, 100% { transform: translateY(-50%) scale(0.8); box-shadow: 0 0 2px var(--accent-red); }
            50% { transform: translateY(-50%) scale(1.4); box-shadow: 0 0 14px var(--accent-red); }
        }

        .control-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input[type="number"] {
            width: 100%;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--accent-blue);
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            outline: none;
            transition: background-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
        }

        input[type="number"]:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 12px rgba(88, 166, 255, 0.25);
            transform: scale(1.01);
        }

        .btn-stack {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 16px;
        }

        button {
            padding: 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            border: none;
            letter-spacing: 0.03em;
            transition: background-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
        }

        button:active {
            transform: translateY(2px) scale(0.98);
        }

        .btn-start {
            background: linear-gradient(135deg, #238636, #2ea043);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(46, 160, 67, 0.3);
        }

        .btn-start:hover {
            box-shadow: 0 6px 20px rgba(46, 160, 67, 0.5);
            transform: translateY(-2px);
        }

        .btn-stop {
            background: linear-gradient(135deg, #da3633, #f85149);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(248, 81, 73, 0.3);
        }

        .btn-stop:hover {
            box-shadow: 0 6px 20px rgba(248, 81, 73, 0.5);
            transform: translateY(-2px);
        }

        .flash-update {
            animation: pulse-border 0.6s ease;
        }

        @keyframes pulse-border {
            0% { border-color: var(--accent-blue); }
            100% { border-color: var(--border-color); }
        }

        .pump-visual { display:flex; align-items:center; justify-content:center; gap:18px; margin:16px auto 10px; min-height:92px; }
        .pump-visual svg { width:150px; max-width:48%; overflow:visible; }
        .pump-visual .pump-shell { fill:#263341; stroke:#8b949e; stroke-width:2.2; }
        .pump-visual .pipe { fill:none; stroke:#58a6ff; stroke-width:7; stroke-linecap:round; stroke-linejoin:round; }
        .pump-visual .impeller { transform-origin:75px 52px; }
        .pump-visual .blade { stroke:#58a6ff; stroke-width:5; stroke-linecap:round; }
        .pump-visual .water-flow { stroke:#39d5ff; stroke-width:3; stroke-linecap:round; stroke-dasharray:7 8; opacity:0; }
        .pump-visual .status-copy { font-size:.78rem; color:var(--text-muted); letter-spacing:.12em; font-weight:800; }
        .pump-visual.is-running .impeller { animation: impeller-spin .7s linear infinite; }
        .pump-visual.is-running .water-flow { opacity:1; animation: water-move .55s linear infinite; }
        .pump-visual.is-running .pump-shell { stroke:var(--accent-green); filter:drop-shadow(0 0 7px rgba(63,185,80,.45)); }
        .pump-visual.is-idle .impeller { animation:none; }
        .pump-visual.is-idle .pipe { stroke:#59636f; }
        @keyframes impeller-spin { to { transform:rotate(360deg); } }
        @keyframes water-move { to { stroke-dashoffset:-30; } }

    </style>
</head>
<body>

<div class="container">
    <header>
        <h1 class="rainbow-text">
            HrX_Mehra_Lab<br>Water_Management_System
        </h1>
    </header>

    <div class="status-stack">
        <div class="status-bar">
            <span class="status-label">Web Dashboard:</span>
            <div class="status-indicator">
                <span id="web-status-dot" class="status-dot"></span>
                <span id="web-status-text" style="color: var(--accent-red);">Disconnected</span>
            </div>
        </div>
        
        <div class="status-bar">
            <span class="status-label">Pump Hardware (Wi-Fi/Internet):</span>
            <div class="status-indicator">
                <span id="pump-status-dot" class="status-dot"></span>
                <span id="pump-status-text" style="color: var(--accent-red);">Offline</span>
            </div>
        </div>

        <div class="status-bar split-bar">
            <div class="split-cell">
                <span class="split-sublabel">Ping Latency</span>
                <span id="ping-latency-val" class="split-subval" style="color: var(--text-muted);">-- ms</span>
            </div>
            <div class="split-cell">
                <span class="split-sublabel">ESP8266 Wi-Fi Signal</span>
                <span id="wifi-signal-val" class="split-subval" style="color: var(--text-muted);">-- dBm</span>
            </div>
        </div>

        <div class="status-bar">
            <span class="status-label">Board Time:</span>
            <div class="status-indicator" style="gap: 10px;">
                <span id="board-time-val" style="color: var(--text-muted);">--:--:--</span>
                <button type="button" class="btn-check" onclick="manualCheckBoard()">Check Now</button>
            </div>
        </div>
    </div>

    <div class="grid-monitor">
        <div class="monitor-panel state-error" id="panel-network">
            <div class="side-rgb left"></div>
            <div class="monitor-label">Current Pump State</div>
            <div id="pump-visual" class="pump-visual is-idle" aria-label="Pump is off">
                <svg viewBox="0 0 170 92" role="img" aria-hidden="true">
                    <path class="pipe" d="M18 52 H43 M108 52 H132 V28 H151" />
                    <rect class="pump-shell" x="42" y="27" width="68" height="50" rx="13" />
                    <rect class="pump-shell" x="54" y="14" width="43" height="15" rx="4" />
                    <circle cx="75" cy="52" r="21" fill="#111820" stroke="#8b949e" stroke-width="2" />
                    <g class="impeller">
                        <path class="blade" d="M75 52 L75 34 M75 52 L92 61 M75 52 L58 61 M75 52 L88 39 M75 52 L62 39" />
                        <circle cx="75" cy="52" r="4" fill="#f0f6fc" />
                    </g>
                    <path class="water-flow" d="M117 52 H158" />
                    <circle cx="23" cy="52" r="4" fill="#58a6ff" />
                </svg>
                <span id="pump-visual-label" class="status-copy">PUMP STANDBY</span>
            </div>
            <div id="pump-runtime-status" class="monitor-value" style="color: var(--accent-red);">Offline</div>
            
            <div class="time-readout-grid">
                <div class="time-box">
                    <span class="time-sublabel">Timer Set</span>
                    <span id="timer-set-val" class="time-subvalue">-- min</span>
                </div>
                <div class="time-box">
                    <span class="time-sublabel">Remaining</span>
                    <span id="timer-remaining-val" class="time-subvalue" style="color: var(--text-muted);">00:00</span>
                </div>
            </div>
            
            <div class="side-rgb right"></div>
        </div>
    </div>

    <div class="control-group">
        <label for="timer-input">Set Custom Run Time (1 - 10 Minutes)</label>
        <input type="number" id="timer-input" min="1" max="10" value="" placeholder="Enter minutes (1 - 10)">
    </div>

    <div class="btn-stack">
        <button class="btn-start" onclick="startPump()">Start Pump</button>
        <button class="btn-stop" onclick="stopPump()">Force Stop</button>
    </div>
</div>

<script>
    // Keep these values identical to the ESP8266 firmware.
    const MQTT_HOST = "broker.emqx.io";
    const MQTT_PORT = 8084;
    const MQTT_PATH = "/mqtt";
    const CLIENT_ID = "WebPanel_" + Math.random().toString(16).slice(2, 10);
    const TOPIC_PREFIX = "hrx_ml_bsp_wlvl_9482/esp8266_pump_ctrl_v2";
    const TOPIC_SWITCH = TOPIC_PREFIX + "/cmd/relay_switch";
    const TOPIC_TIMER_SET = TOPIC_PREFIX + "/cfg/run_duration_min";
    const TOPIC_PING = TOPIC_PREFIX + "/cmd/link_ping_nonce";
    const TOPIC_STATUS = TOPIC_PREFIX + "/tele/link_pong_state";
    const TOPIC_TELEMETRY = TOPIC_PREFIX + "/tele/pump_timer_state";
    const TOPIC_BOARD_TIME = TOPIC_PREFIX + "/tele/ntp_clock_hhmmss";
    const TOPIC_WIFI_RSSI = TOPIC_PREFIX + "/tele/sta_wifi_rssi_dbm";

    const client = new Paho.MQTT.Client(MQTT_HOST, MQTT_PORT, MQTT_PATH, CLIENT_ID);
    let brokerConnected = false;
    let boardOnline = false;
    let pingTimer = null;
    let reconnectTimer = null;
    let commandTimer = null;
    let pendingNonces = new Map();
    let commandPending = false;
    let expectedCommandState = null;
    let pumpIsRunning = false;
    let lastTelemetryAt = 0;
    const BOARD_STALE_MS = 30000;

    const $ = id => document.getElementById(id);
    client.onConnectionLost = onConnectionLost;
    client.onMessageArrived = onMessageArrived;
    connectBroker();

    function setWebStatus(text, online) {
        $('web-status-dot').className = online ? 'status-dot connected' : 'status-dot';
        $('web-status-text').textContent = text;
        $('web-status-text').style.color = online ? 'var(--accent-green)' : 'var(--accent-red)';
    }
    function setBoardStatus(text, online) {
        boardOnline = online;
        $('pump-status-dot').className = online ? 'status-dot connected' : 'status-dot';
        $('pump-status-text').textContent = text;
        $('pump-status-text').style.color = online ? 'var(--accent-green)' : 'var(--accent-red)';
        updateButtons();
    }
    function updateButtons() {
        const enabled = brokerConnected && boardOnline && !commandPending;
        document.querySelector('.btn-start').disabled = !enabled;
        document.querySelector('.btn-stop').disabled = !enabled;
        document.querySelector('.btn-start').style.opacity = enabled ? '1' : '.55';
        document.querySelector('.btn-stop').style.opacity = enabled ? '1' : '.55';
    }
    function setPumpDisplay(running, remaining, duration) {
        pumpIsRunning = running;
        const visual = $('pump-visual');
        if (visual && visual.dataset.lastState !== (running ? 'running' : 'idle')) {
            visual.dataset.lastState = running ? 'running' : 'idle';
            visual.classList.toggle('is-running', running);
            visual.classList.toggle('is-idle', !running);
            visual.setAttribute('aria-label', running ? 'Pump is running' : 'Pump is off');
            $('pump-visual-label').textContent = running ? 'WATER FLOW ACTIVE' : 'PUMP STANDBY';
        }
        $('pump-runtime-status').textContent = running ? 'Pump Active' : 'Idle';
        $('pump-runtime-status').style.color = running ? 'var(--accent-blue)' : 'var(--accent-green)';
        if (running) {
            if (duration) $('timer-set-val').textContent = duration + ' min';
            if (remaining) $('timer-remaining-val').textContent = remaining;
            $('timer-remaining-val').style.color = 'var(--accent-green)';
            updateRGBPattern('running');
        } else {
            resetTimerDisplay();
            updateRGBPattern('idle');
        }
        if (commandPending && expectedCommandState === running) { expectedCommandState = null; clearCommandPending(); }
    }
    function clearCommandPending() {
        commandPending = false;
        expectedCommandState = null;
        if (commandTimer) { clearTimeout(commandTimer); commandTimer = null; }
        updateButtons();
    }
    function markCommandPending(label) {
        commandPending = true;
        updateButtons();
        $('pump-runtime-status').textContent = label;
        $('pump-runtime-status').style.color = 'var(--accent-blue)';
        if (commandTimer) clearTimeout(commandTimer);
        commandTimer = setTimeout(() => {
            commandPending = false;
            updateButtons();
            $('pump-runtime-status').textContent = pumpIsRunning ? 'Pump Active' : 'Waiting for board status';
        }, 6000);
    }
    function connectBroker() {
        if (client.isConnected()) return;
        if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
        try {
            client.connect({
                useSSL: true,
                cleanSession: true,
                keepAliveInterval: 30,
                timeout: 8,
                onSuccess: onConnect,
                onFailure: () => {
                    brokerConnected = false;
                    setWebStatus('Connection retrying', false);
                    updateButtons();
                    scheduleReconnect();
                }
            });
        } catch (e) { scheduleReconnect(); }
    }
    function scheduleReconnect() {
        if (reconnectTimer) return;
        reconnectTimer = setTimeout(() => { reconnectTimer = null; connectBroker(); }, 3000);
    }
    function onConnect() {
        brokerConnected = true;
        setWebStatus('Connected', true);
        client.subscribe(TOPIC_STATUS, {qos: 1});
        client.subscribe(TOPIC_TELEMETRY, {qos: 1});
        client.subscribe(TOPIC_BOARD_TIME, {qos: 0});
        client.subscribe(TOPIC_WIFI_RSSI, {qos: 0});
        sendPingProbe();
        if (pingTimer) clearInterval(pingTimer);
        pingTimer = setInterval(sendPingProbe, 10000);
        updateButtons();
    }
    function onConnectionLost(response) {
        brokerConnected = false;
        setWebStatus('Disconnected - reconnecting', false);
        setBoardStatus('Board status unknown', false);
        if (pingTimer) { clearInterval(pingTimer); pingTimer = null; }
        scheduleReconnect();
    }
    function sendPingProbe() {
        if (!brokerConnected || !client.isConnected()) return;
        const nonce = String(Date.now()) + String(Math.floor(Math.random() * 1000));
        pendingNonces.set(nonce, performance.now());
        for (const [key, sent] of pendingNonces) if (performance.now() - sent > 15000) pendingNonces.delete(key);
        const msg = new Paho.MQTT.Message('PING:' + nonce);
        msg.destinationName = TOPIC_PING;
        msg.qos = 1;
        msg.retained = false;
        try { client.send(msg); } catch (e) { /* reconnect handler will recover */ }
    }
    function manualCheckBoard() {
        if (!brokerConnected) { alert('Dashboard is reconnecting to MQTT. Please wait.'); return; }
        sendPingProbe();
    }
    function onMessageArrived(message) {
        const topic = message.destinationName;
        const payload = (message.payloadString || '').trim();
        if (!payload) return;
        if (topic === TOPIC_STATUS) {
            if (payload === 'OFFLINE') {
                setBoardStatus('Offline', false);
                return;
            }
            if (payload.startsWith('PONG:')) {
                const nonce = payload.substring(5);
                if (pendingNonces.has(nonce) || nonce === 'BOOT' || nonce === '0') {
                    const sent = pendingNonces.get(nonce);
                    if (sent !== undefined) {
                        const rtt = Math.max(1, Math.round(performance.now() - sent));
                        $('ping-latency-val').textContent = rtt + ' ms';
                        $('ping-latency-val').style.color = rtt < 250 ? 'var(--accent-green)' : (rtt < 800 ? 'var(--accent-blue)' : 'var(--accent-red)');
                    }
                    pendingNonces.delete(nonce);
                    setBoardStatus('Online', true);
                    lastTelemetryAt = Date.now();
                }
            }
            return;
        }
        if (topic === TOPIC_WIFI_RSSI) {
            const n = parseInt(payload, 10);
            $('wifi-signal-val').textContent = Number.isNaN(n) ? payload : n + ' dBm';
            $('wifi-signal-val').style.color = Number.isNaN(n) ? 'var(--text-muted)' : (n >= -60 ? 'var(--accent-green)' : (n >= -75 ? 'var(--accent-blue)' : 'var(--accent-red)'));
            return;
        }
        if (topic === TOPIC_BOARD_TIME) {
            $('board-time-val').textContent = payload;
            $('board-time-val').style.color = payload.includes('UPTIME') ? 'var(--text-muted)' : 'var(--accent-blue)';
            return;
        }
        if (topic === TOPIC_TELEMETRY) {
            lastTelemetryAt = Date.now();
            setBoardStatus('Online', true);
            // Firmware sends: "MM:SS left out of N min" or "Idle".
            const match = payload.match(/^(\d{2}:\d{2})\s+left out of\s+(\d+)\s+min$/i);
            if (match) setPumpDisplay(true, match[1], match[2]);
            else if (payload === 'Idle' || payload === 'OFF') setPumpDisplay(false, '', '');
        }
    }
    function sendCommand(payload, pendingLabel) {
        if (!brokerConnected || !boardOnline || !client.isConnected()) {
            alert('The pump board is not currently confirmed online. Please wait for the Online status.');
            return false;
        }
        const msg = new Paho.MQTT.Message(payload);
        msg.destinationName = TOPIC_SWITCH;
        msg.qos = 1;
        msg.retained = false;
        try {
            expectedCommandState = payload === 'OFF' ? false : true;
            markCommandPending(pendingLabel);
            client.send(msg);
            return true;
        } catch (e) {
            clearCommandPending();
            alert('Command could not be sent. Dashboard will reconnect.');
            return false;
        }
    }
    function startPump() {
        let value = parseInt($('timer-input').value, 10);
        if (!Number.isInteger(value) || value < 1 || value > 10) {
            alert('Enter a run time from 1 to 10 minutes.');
            return;
        }
        sendCommand('ON:' + value, 'Starting pump...');
    }
    function stopPump() {
        sendCommand('OFF', 'Stopping pump...');
    }

    function triggerFlash(id) {
        const el = $(id);
        if (!el) return;
        el.classList.add('flash-update');
        setTimeout(() => el.classList.remove('flash-update'), 650);
    }
    function resetTimerDisplay() {
        $('timer-set-val').textContent = '-- min';
        $('timer-remaining-val').textContent = '00:00';
        $('timer-remaining-val').style.color = 'var(--text-muted)';
    }
    function updateRGBPattern(state) {
        const panel = $('panel-network');
        panel.classList.remove('state-idle', 'state-running', 'state-error');
        panel.classList.add(state === 'running' ? 'state-running' : (state === 'idle' ? 'state-idle' : 'state-error'));
    }
    // If no valid telemetry arrives, show stale status without changing the relay.
    setInterval(() => {
        if (boardOnline && lastTelemetryAt && Date.now() - lastTelemetryAt > BOARD_STALE_MS) {
            setBoardStatus('No board response', false);
        }
    }, 5000);
    updateButtons();
</script>
</body>
</html>
