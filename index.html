<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hrx_MehraLab_Bilaspur | Water Control Panel</title>
    <!-- MQTT Over WebSockets Client Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --panel-bg: #0d1117;
            --border-color: #30363d;
            --accent-blue: #58a6ff;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Entrance Animation */
        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
        }

        header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            color: var(--text-main);
        }

        header p {
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-top: 4px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 0.875rem;
        }

        .status-indicator {
            display: flex;
            align-items: center;
        }

        .status-dot {
            height: 10px;
            width: 10px;
            border-radius: 50%;
            display: inline-block;
            background-color: var(--accent-red);
            margin-right: 8px;
            transition: all 0.3s ease;
        }

        .status-dot.connected {
            background-color: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green);
            animation: pulse-glow 1.8s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0% { transform: scale(0.95); opacity: 0.7; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.7; }
        }

        /* Animated Water Pump Visualizer Box */
        .pump-visualizer {
            height: 60px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .water-wave {
            position: absolute;
            bottom: -100%;
            left: 0;
            width: 200%;
            height: 100%;
            background: rgba(88, 166, 255, 0.2);
            border-radius: 40%;
            transition: bottom 0.8s ease;
        }

        .pump-visualizer.active .water-wave {
            bottom: -20%;
            animation: waveMove 4s linear infinite;
        }

        @keyframes waveMove {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .turbine-icon {
            font-size: 1.5rem;
            z-index: 2;
            transition: transform 0.3s ease, color 0.3s ease;
            color: var(--text-muted);
        }

        .pump-visualizer.active .turbine-icon {
            color: var(--accent-blue);
            animation: spin 1.2s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .grid-monitor {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
            margin-bottom: 20px;
        }

        .monitor-panel {
            text-align: center;
            background: var(--panel-bg);
            padding: 18px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            transition: border-color 0.3s, transform 0.2s ease;
            position: relative;
        }

        .monitor-panel:hover {
            transform: translateY(-2px);
        }

        .monitor-label {
            font-size: 0.825rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }

        .monitor-value {
            font-size: 1.25rem;
            font-weight: 700;
            margin-top: 6px;
            transition: color 0.3s ease;
        }

        .control-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input[type="number"] {
            width: 100%;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--accent-blue);
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            outline: none;
            transition: all 0.25s ease;
        }

        input[type="number"]:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 12px rgba(88, 166, 255, 0.25);
            transform: scale(1.01);
        }

        .btn-stack {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 16px;
        }

        button {
            padding: 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            border: none;
            letter-spacing: 0.03em;
            position: relative;
            overflow: hidden;
            transition: all 0.25s ease;
        }

        button:active {
            transform: translateY(2px) scale(0.98);
        }

        .btn-start {
            background: linear-gradient(135deg, #238636, #2ea043);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(46, 160, 67, 0.3);
        }

        .btn-start:hover {
            box-shadow: 0 6px 20px rgba(46, 160, 67, 0.5);
            transform: translateY(-2px);
        }

        .btn-stop {
            background: linear-gradient(135deg, #da3633, #f85149);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(248, 81, 73, 0.3);
        }

        .btn-stop:hover {
            box-shadow: 0 6px 20px rgba(248, 81, 73, 0.5);
            transform: translateY(-2px);
        }

        /* Pulse highlight on telemetry change */
        .flash-update {
            animation: pulse-border 0.6s ease;
        }

        @keyframes pulse-border {
            0% { border-color: var(--accent-blue); }
            100% { border-color: var(--border-color); }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>System Control Panel</h1>
        <p>hrx_MehraLab_Bilaspur Water Management Automation</p>
    </header>

    <div class="status-bar">
        <span>Web Dashboard Link:</span>
        <div class="status-indicator">
            <span id="status-dot" class="status-dot"></span>
            <span id="status-text">Disconnected</span>
        </div>
    </div>

    <!-- Interactive Visualizer -->
    <div id="pump-visualizer" class="pump-visualizer">
        <div class="water-wave"></div>
        <div class="turbine-icon">⚙️</div>
    </div>

    <div class="grid-monitor">
        <div class="monitor-panel" id="panel-network">
            <div class="monitor-label">Pump Network Status</div>
            <div id="pump-network-status" class="monitor-value" style="color: var(--accent-red);">Disconnected</div>
        </div>
        
        <div class="monitor-panel" id="panel-run">
            <div class="monitor-label">Current Run State</div>
            <div id="pump-run-status" class="monitor-value" style="color: var(--text-muted);">Idle</div>
        </div>
    </div>

    <!-- Set to startup with 0 default, minimum value 0 -->
    <div class="control-group">
        <label for="timer-input">Set Custom Run Time (Minutes)</label>
        <input type="number" id="timer-input" min="0" max="120" value="0" placeholder="e.g. 10">
    </div>

    <div class="btn-stack">
        <button class="btn-start" onclick="startPump()">Start Pump</button>
        <button class="btn-stop" onclick="stopPump()">Force Stop</button>
    </div>
</div>

<script>
    const MQTT_HOST = "broker.hivemq.com"; 
    const MQTT_PORT = 8884; 
    const CLIENT_ID = "WebPanel_" + Math.random().toString(16).substr(2, 8);

    const TOPIC_SWITCH = "hrx_ml_bsp_wlvl_9482/node_esp8266/io_exec_switch";
    const TOPIC_TIMER_SET = "hrx_ml_bsp_wlvl_9482/node_esp8266/config_runtime_min";
    const TOPIC_STATUS = "hrx_ml_bsp_wlvl_9482/node_esp8266/telemetry_link_status";
    const TOPIC_TELEMETRY = "hrx_ml_bsp_wlvl_9482/node_esp8266/telemetry_runtime_state";

    const client = new Paho.MQTT.Client(MQTT_HOST, Number(MQTT_PORT), CLIENT_ID);

    client.onConnectionLost = onConnectionLost;
    client.onMessageArrived = onMessageArrived;

    connectBroker();

    function connectBroker() {
        const options = {
            onSuccess: onConnect,
            onFailure: onFailure,
            keepAliveInterval: 10,
            useSSL: true 
        };
        client.connect(options);
    }

    function triggerFlash(elementId) {
        const el = document.getElementById(elementId);
        el.classList.remove("flash-update");
        void el.offsetWidth; // Trigger reflow
        el.classList.add("flash-update");
    }

    function setVisualizerActive(active) {
        const vis = document.getElementById("pump-visualizer");
        if (active) {
            vis.classList.add("active");
        } else {
            vis.classList.remove("active");
        }
    }

    function onConnect() {
        document.getElementById("status-dot").className = "status-dot connected";
        document.getElementById("status-text").innerText = "Connected";
        
        client.subscribe(TOPIC_STATUS);
        client.subscribe(TOPIC_TELEMETRY);
    }

    function onFailure(message) {
        document.getElementById("status-text").innerText = "Connection Failed";
        setTimeout(connectBroker, 3000); 
    }

    function onConnectionLost(responseObject) {
        document.getElementById("status-dot").className = "status-dot";
        document.getElementById("status-text").innerText = "Disconnected";
        
        document.getElementById("pump-network-status").innerText = "Disconnected";
        document.getElementById("pump-network-status").style.color = "var(--accent-red)";
        document.getElementById("pump-run-status").innerText = "Unknown";
        document.getElementById("pump-run-status").style.color = "var(--text-muted)";
        
        setVisualizerActive(false);

        if (responseObject.errorCode !== 0) {
            setTimeout(connectBroker, 3000);
        }
    }

    function onMessageArrived(message) {
        if (message.destinationName === TOPIC_STATUS) {
            const payload = message.payloadString;
            document.getElementById("pump-network-status").innerText = payload;
            triggerFlash("panel-network");
            
            if (payload === "Connected to Broker") {
                document.getElementById("pump-network-status").style.color = "var(--accent-green)";
            } else {
                document.getElementById("pump-network-status").style.color = "var(--accent-red)";
                document.getElementById("pump-run-status").innerText = "Offline";
                document.getElementById("pump-run-status").style.color = "var(--text-muted)";
                setVisualizerActive(false);
            }
        }
        
        if (message.destinationName === TOPIC_TELEMETRY) {
            const payload = message.payloadString;
            document.getElementById("pump-run-status").innerText = payload;
            triggerFlash("panel-run");
            
            if (payload.includes("left out of")) {
                document.getElementById("pump-run-status").style.color = "var(--accent-blue)";
                setVisualizerActive(true);
            } else if (payload === "Idle") {
                document.getElementById("pump-run-status").style.color = "var(--text-muted)";
                setVisualizerActive(false);
            } else {
                document.getElementById("pump-run-status").style.color = "var(--accent-green)";
                setVisualizerActive(true);
            }
        }
    }

    function startPump() {
        const timerValue = document.getElementById("timer-input").value;
        if (timerValue === "" || timerValue < 0) {
            alert("Please enter a valid time duration.");
            return;
        }

        const timerMessage = new Paho.MQTT.Message(timerValue.toString());
        timerMessage.destinationName = TOPIC_TIMER_SET;
        timerMessage.qos = 1;
        client.send(timerMessage);

        const switchMessage = new Paho.MQTT.Message("ON");
        switchMessage.destinationName = TOPIC_SWITCH;
        switchMessage.qos = 1;
        client.send(switchMessage);
    }

    function stopPump() {
        const message = new Paho.MQTT.Message("OFF");
        message.destinationName = TOPIC_SWITCH;
        message.qos = 1;
        client.send(message);
    }
</script>
</body>
</html>
