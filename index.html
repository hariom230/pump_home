<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HrX_Mehra_Lab Water Management System</title>
    <!-- MQTT Over WebSockets Client Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --panel-bg: #0d1117;
            --border-color: #30363d;
            --accent-blue: #58a6ff;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
        }

        header h1.rainbow-text {
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: -0.01em;
            word-break: break-word;
            line-height: 1.3;
            background: linear-gradient(
                90deg, 
                #ff0000, 
                #ff7f00, 
                #ffff00, 
                #00ff00, 
                #00ffff, 
                #0000ff, 
                #8b00ff, 
                #ff0000
            );
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: rainbowShift 6s linear infinite;
            will-change: background-position;
        }

        @keyframes rainbowShift {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .status-stack {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.825rem;
        }

        .split-bar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            padding: 0;
            overflow: hidden;
        }

        .split-cell {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px 10px;
            text-align: center;
        }

        .split-cell:first-child {
            border-right: 1px solid var(--border-color);
        }

        .split-sublabel {
            font-size: 0.7rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            margin-bottom: 3px;
        }

        .split-subval {
            font-size: 0.88rem;
            font-weight: 700;
        }

        .status-label {
            color: var(--text-muted);
            font-weight: 500;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            font-weight: 600;
        }

        .status-dot {
            height: 9px;
            width: 9px;
            border-radius: 50%;
            display: inline-block;
            background-color: var(--accent-red);
            margin-right: 8px;
        }

        .status-dot.connected {
            background-color: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green);
        }

        .btn-check {
            background: rgba(88, 166, 255, 0.14);
            color: var(--accent-blue);
            border: 1px solid rgba(88, 166, 255, 0.45);
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .btn-check:hover {
            background: rgba(88, 166, 255, 0.28);
        }

        .grid-monitor {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .monitor-panel {
            text-align: center;
            background: var(--panel-bg);
            padding: 16px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .monitor-label {
            font-size: 0.78rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }

        .monitor-value {
            font-size: 1.15rem;
            font-weight: 700;
            margin-top: 4px;
            position: relative;
            z-index: 2;
        }

        .time-readout-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed var(--border-color);
        }

        .time-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .time-sublabel {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .time-subvalue {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--accent-blue);
            margin-top: 2px;
        }

        .side-rgb {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #484f58;
            opacity: 0.35;
        }

        .side-rgb.left { left: 16px; }
        .side-rgb.right { right: 16px; }

        .monitor-panel.state-idle .side-rgb {
            background: #38bdf8;
            opacity: 0.85;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.6);
        }

        .monitor-panel.state-running {
            border-color: rgba(56, 189, 248, 0.45);
            box-shadow: inset 0 0 14px rgba(56, 189, 248, 0.1);
        }

        .monitor-panel.state-running .side-rgb {
            background: #38ef7d;
            opacity: 1;
            box-shadow: 0 0 12px #38ef7d;
        }

        .monitor-panel.state-error .side-rgb {
            background: var(--accent-red);
            opacity: 1;
            box-shadow: 0 0 10px var(--accent-red);
        }

        .control-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input[type="number"] {
            width: 100%;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--accent-blue);
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            outline: none;
            transition: border-color 0.15s ease;
        }

        input[type="number"]:focus {
            border-color: var(--accent-blue);
        }

        .btn-stack {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 16px;
        }

        button {
            padding: 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            border: none;
            letter-spacing: 0.03em;
            transition: transform 0.1s ease, opacity 0.15s ease;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-start {
            background: linear-gradient(135deg, #238636, #2ea043);
            color: #ffffff;
        }

        .btn-start:hover {
            opacity: 0.92;
        }

        .btn-stop {
            background: linear-gradient(135deg, #da3633, #f85149);
            color: #ffffff;
        }

        .btn-stop:hover {
            opacity: 0.92;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1 class="rainbow-text">
            HrX_Mehra_Lab<br>Water_Management_System
        </h1>
    </header>

    <div class="status-stack">
        <div class="status-bar">
            <span class="status-label">Web Dashboard:</span>
            <div class="status-indicator">
                <span id="web-status-dot" class="status-dot"></span>
                <span id="web-status-text" style="color: var(--accent-red);">Disconnected</span>
            </div>
        </div>
        
        <div class="status-bar">
            <span class="status-label">Pump Hardware (Wi-Fi/Internet):</span>
            <div class="status-indicator">
                <span id="pump-status-dot" class="status-dot"></span>
                <span id="pump-status-text" style="color: var(--accent-red);">Offline</span>
            </div>
        </div>

        <div class="status-bar split-bar">
            <div class="split-cell">
                <span class="split-sublabel">Ping Latency</span>
                <span id="ping-latency-val" class="split-subval" style="color: var(--text-muted);">-- ms</span>
            </div>
            <div class="split-cell">
                <span class="split-sublabel">ESP8266 Wi-Fi Signal</span>
                <span id="wifi-signal-val" class="split-subval" style="color: var(--text-muted);">-- dBm</span>
            </div>
        </div>

        <div class="status-bar">
            <span class="status-label">Board Time:</span>
            <div class="status-indicator" style="gap: 10px;">
                <span id="board-time-val" style="color: var(--text-muted);">--:--:--</span>
                <button type="button" class="btn-check" onclick="manualCheckBoard()">Check Now</button>
            </div>
        </div>
    </div>

    <div class="grid-monitor">
        <div class="monitor-panel state-error" id="panel-network">
            <div class="side-rgb left"></div>
            <div class="monitor-label">Current Pump State</div>
            <div id="pump-runtime-status" class="monitor-value" style="color: var(--accent-red);">Offline</div>
            
            <div class="time-readout-grid">
                <div class="time-box">
                    <span class="time-sublabel">Timer Set</span>
                    <span id="timer-set-val" class="time-subvalue">-- min</span>
                </div>
                <div class="time-box">
                    <span class="time-sublabel">Remaining</span>
                    <span id="timer-remaining-val" class="time-subvalue" style="color: var(--text-muted);">00:00</span>
                </div>
            </div>
            
            <div class="side-rgb right"></div>
        </div>
    </div>

    <div class="control-group">
        <label for="timer-input">Set Custom Run Time (1 - 60 Minutes)</label>
        <input type="number" id="timer-input" min="1" max="60" value="" placeholder="Enter minutes (1 - 60)">
    </div>

    <div class="btn-stack">
        <button class="btn-start" onclick="startPump()">Start Pump</button>
        <button class="btn-stop" onclick="stopPump()">Force Stop</button>
    </div>
</div>

<script>
    const MQTT_HOST = "broker.emqx.io"; 
    const MQTT_PORT = 8084;
    const MQTT_PATH = "/mqtt";
    const CLIENT_ID = "WebPanel_" + Math.random().toString(16).substr(2, 8);

    const TOPIC_PREFIX = "hrx_ml_bsp_wlvl_9482/esp8266_pump_ctrl_v2";
    const TOPIC_SWITCH = TOPIC_PREFIX + "/cmd/relay_switch";
    const TOPIC_TIMER_SET = TOPIC_PREFIX + "/cfg/run_duration_min";
    const TOPIC_PING = TOPIC_PREFIX + "/cmd/link_ping_nonce";
    const TOPIC_STATUS = TOPIC_PREFIX + "/tele/link_pong_state";
    const TOPIC_TELEMETRY = TOPIC_PREFIX + "/tele/pump_timer_state";
    const TOPIC_BOARD_TIME = TOPIC_PREFIX + "/tele/ntp_clock_hhmmss";
    const TOPIC_WIFI_RSSI = TOPIC_PREFIX + "/tele/sta_wifi_rssi_dbm";

    const client = new Paho.MQTT.Client(MQTT_HOST, Number(MQTT_PORT), MQTT_PATH, CLIENT_ID);

    let isBrokerConnected = false;
    let isBoardConfirmed = false;
    const pendingNonces = new Map();
    let heartbeatTimer = null;
    let pingInterval = null;
    let localTickInterval = null;

    let localPumpActive = false;
    let localRemainingSec = 0;
    let localSetMin = 0;
    let lastLocalTickMs = 0;

    // Generous timeout (25s) with 5s ping interval prevents false offline drops on public broker/Wi-Fi jitter
    const HEARTBEAT_TIMEOUT_MS = 25000;
    const PING_INTERVAL_MS = 5000;

    client.onConnectionLost = onConnectionLost;
    client.onMessageArrived = onMessageArrived;

    setBoardOffline("Offline");
    connectBroker();
    startLocalCountdownTick();

    function connectBroker() {
        const options = {
            onSuccess: onConnect,
            onFailure: onFailure,
            keepAliveInterval: 20,
            useSSL: true 
        };
        client.connect(options);
    }

    function formatMMSS(totalSec) {
        const clamped = Math.max(0, Math.floor(totalSec));
        const mm = String(Math.floor(clamped / 60)).padStart(2, "0");
        const ss = String(clamped % 60).padStart(2, "0");
        return mm + ":" + ss;
    }

    function renderRunningState(remSec, setMinVal) {
        document.getElementById("pump-runtime-status").innerText = "Pump Active";
        document.getElementById("pump-runtime-status").style.color = "var(--accent-blue)";
        const remEl = document.getElementById("timer-remaining-val");
        remEl.innerText = formatMMSS(remSec);
        remEl.style.color = "var(--accent-green)";
        document.getElementById("timer-set-val").innerText = setMinVal + " min";
        updateRGBPattern("running");
    }

    function renderIdleState() {
        localPumpActive = false;
        localRemainingSec = 0;
        document.getElementById("pump-runtime-status").innerText = "Idle";
        document.getElementById("pump-runtime-status").style.color = "var(--accent-green)";
        resetTimerDisplay();
        updateRGBPattern("idle");
    }

    function startLocalCountdownTick() {
        if (localTickInterval) clearInterval(localTickInterval);
        localTickInterval = setInterval(() => {
            if (!isBoardConfirmed || !localPumpActive) return;
            const nowPerf = performance.now();
            const elapsedSec = (nowPerf - lastLocalTickMs) / 1000;
            lastLocalTickMs = nowPerf;
            localRemainingSec = Math.max(0, localRemainingSec - elapsedSec);
            document.getElementById("timer-remaining-val").innerText = formatMMSS(localRemainingSec);
        }, 1000);
    }

    function sendPingProbe() {
        if (!isBrokerConnected) return;
        const nonce = Math.floor(100000 + Math.random() * 900000).toString();
        const sentAt = performance.now();
        pendingNonces.set(nonce, sentAt);

        for (const [key, ts] of pendingNonces.entries()) {
            if (sentAt - ts > 30000) {
                pendingNonces.delete(key);
            }
        }

        const pingMsg = new Paho.MQTT.Message("PING:" + nonce);
        pingMsg.destinationName = TOPIC_PING;
        pingMsg.qos = 0;
        client.send(pingMsg);
    }

    function manualCheckBoard() {
        if (!isBrokerConnected) {
            alert("Web Dashboard is not connected to the MQTT broker yet.");
            return;
        }
        if (!isBoardConfirmed) {
            setBoardOffline("Offline (Checking...)");
        }
        sendPingProbe();
        resetHeartbeat();
    }

    function startPingLoop() {
        stopPingLoop();
        sendPingProbe();
        pingInterval = setInterval(sendPingProbe, PING_INTERVAL_MS);
    }

    function stopPingLoop() {
        if (pingInterval) {
            clearInterval(pingInterval);
            pingInterval = null;
        }
    }

    function resetTimerDisplay() {
        document.getElementById("timer-set-val").innerText = "-- min";
        document.getElementById("timer-remaining-val").innerText = "00:00";
        document.getElementById("timer-remaining-val").style.color = "var(--text-muted)";
    }

    function resetBoardTimeDisplay() {
        document.getElementById("board-time-val").innerText = "--:--:--";
        document.getElementById("board-time-val").style.color = "var(--text-muted)";
    }

    function resetLatencyDisplay() {
        const el = document.getElementById("ping-latency-val");
        el.innerText = "-- ms";
        el.style.color = "var(--text-muted)";
    }

    function resetWifiSignalDisplay() {
        const el = document.getElementById("wifi-signal-val");
        el.innerText = "-- dBm";
        el.style.color = "var(--text-muted)";
    }

    function updateLatencyDisplay(rttMs) {
        const el = document.getElementById("ping-latency-val");
        const rounded = Math.max(1, Math.round(rttMs));
        el.innerText = rounded + " ms";
        if (rounded < 350) {
            el.style.color = "var(--accent-green)";
        } else if (rounded < 1000) {
            el.style.color = "var(--accent-blue)";
        } else {
            el.style.color = "var(--accent-red)";
        }
    }

    function updateWifiSignalDisplay(payload) {
        const el = document.getElementById("wifi-signal-val");
        const rssiNum = parseInt(payload, 10);
        if (isNaN(rssiNum)) {
            el.innerText = payload;
            el.style.color = "var(--text-muted)";
            return;
        }
        let quality = "Weak";
        let color = "var(--accent-red)";
        if (rssiNum >= -60) {
            quality = "Strong";
            color = "var(--accent-green)";
        } else if (rssiNum >= -75) {
            quality = "Fair";
            color = "var(--accent-blue)";
        }
        el.innerText = rssiNum + " dBm (" + quality + ")";
        el.style.color = color;
    }

    function resetHeartbeat() {
        if (heartbeatTimer) clearTimeout(heartbeatTimer);
        heartbeatTimer = setTimeout(() => {
            setBoardOffline("Offline (No Response)");
        }, HEARTBEAT_TIMEOUT_MS);
    }

    function updateRGBPattern(state) {
        const panel = document.getElementById("panel-network");
        panel.classList.remove("state-idle", "state-running", "state-error");
        
        if (state === "running") {
            panel.classList.add("state-running");
        } else if (state === "idle") {
            panel.classList.add("state-idle");
        } else {
            panel.classList.add("state-error");
        }
    }

    function setBoardOffline(offlineText = "Offline") {
        isBoardConfirmed = false;
        localPumpActive = false;
        localRemainingSec = 0;
        pendingNonces.clear();
        const dot = document.getElementById("pump-status-dot");
        const txt = document.getElementById("pump-status-text");
        dot.className = "status-dot";
        txt.innerText = offlineText;
        txt.style.color = offlineText.includes("Checking") ? "var(--accent-blue)" : "var(--accent-red)";

        document.getElementById("pump-runtime-status").innerText = offlineText.includes("Checking") ? "Checking..." : "Offline";
        document.getElementById("pump-runtime-status").style.color = offlineText.includes("Checking") ? "var(--accent-blue)" : "var(--accent-red)";
        resetTimerDisplay();
        resetBoardTimeDisplay();
        resetLatencyDisplay();
        resetWifiSignalDisplay();
        updateRGBPattern("error");
        if (heartbeatTimer) {
            clearTimeout(heartbeatTimer);
            heartbeatTimer = null;
        }
    }

    function confirmBoardOnline(rttMs = null) {
        const wasOffline = !isBoardConfirmed;
        isBoardConfirmed = true;
        const dot = document.getElementById("pump-status-dot");
        const txt = document.getElementById("pump-status-text");
        dot.className = "status-dot connected";
        txt.innerText = "Online (Confirmed)";
        txt.style.color = "var(--accent-green)";
        if (rttMs !== null) {
            updateLatencyDisplay(rttMs);
        }
        if (wasOffline && !localPumpActive) {
            renderIdleState();
        }
        resetHeartbeat();
    }

    function onConnect() {
        isBrokerConnected = true;
        document.getElementById("web-status-dot").className = "status-dot connected";
        const webTxt = document.getElementById("web-status-text");
        webTxt.innerText = "Connected";
        webTxt.style.color = "var(--accent-green)";

        setBoardOffline("Offline (Checking...)");

        client.subscribe(TOPIC_STATUS);
        client.subscribe(TOPIC_TELEMETRY);
        client.subscribe(TOPIC_BOARD_TIME);
        client.subscribe(TOPIC_WIFI_RSSI);

        startPingLoop();
    }

    function onFailure(message) {
        isBrokerConnected = false;
        stopPingLoop();
        const webTxt = document.getElementById("web-status-text");
        webTxt.innerText = "Connection Failed";
        webTxt.style.color = "var(--accent-red)";
        document.getElementById("web-status-dot").className = "status-dot";
        setBoardOffline("Offline");
        setTimeout(connectBroker, 3000); 
    }

    function onConnectionLost(responseObject) {
        isBrokerConnected = false;
        stopPingLoop();
        document.getElementById("web-status-dot").className = "status-dot";
        const webTxt = document.getElementById("web-status-text");
        webTxt.innerText = "Disconnected";
        webTxt.style.color = "var(--accent-red)";
        
        setBoardOffline("Offline");

        if (responseObject.errorCode !== 0) {
            setTimeout(connectBroker, 3000);
        }
    }

    function onMessageArrived(message) {
        const topic = message.destinationName;
        const payload = message.payloadString.trim();

        if (payload.length === 0) return;

        if (topic === TOPIC_STATUS) {
            if (payload === "OFFLINE") {
                setBoardOffline("Offline");
                return;
            }

            if (payload.startsWith("PONG:")) {
                const replyNonce = payload.substring(5);
                const nowPerf = performance.now();
                let elapsedMs = null;

                if (pendingNonces.has(replyNonce)) {
                    elapsedMs = nowPerf - pendingNonces.get(replyNonce);
                    pendingNonces.delete(replyNonce);
                }

                // Accept any valid PONG reply so minor latency spikes don't drop Online status
                confirmBoardOnline(elapsedMs);
            }
            return;
        }

        if (topic === TOPIC_WIFI_RSSI) {
            if (isBoardConfirmed) resetHeartbeat();
            updateWifiSignalDisplay(payload);
            return;
        }

        if (topic === TOPIC_BOARD_TIME) {
            if (isBoardConfirmed) resetHeartbeat();
            const timeEl = document.getElementById("board-time-val");
            timeEl.innerText = payload;
            timeEl.style.color = payload.includes("Syncing") ? "var(--accent-red)" : "var(--accent-blue)";
            return;
        }
        
        if (topic === TOPIC_TELEMETRY) {
            if (isBoardConfirmed) resetHeartbeat();

            if (payload.includes("left out of")) {
                const parts = payload.split("left out of");
                const remPart = parts[0].trim();
                const setPart = parts[1].trim();
                const mmssParts = remPart.split(":");
                const parsedSec = (mmssParts.length === 2)
                    ? (parseInt(mmssParts[0], 10) * 60 + parseInt(mmssParts[1], 10))
                    : 0;
                const parsedSetMin = parseInt(setPart, 10) || 0;

                localPumpActive = true;
                localRemainingSec = isNaN(parsedSec) ? 0 : parsedSec;
                localSetMin = parsedSetMin;
                lastLocalTickMs = performance.now();

                if (isBoardConfirmed) {
                    renderRunningState(localRemainingSec, localSetMin);
                }
            } else if (payload === "Idle" || payload === "OFF") {
                if (isBoardConfirmed) {
                    renderIdleState();
                } else {
                    localPumpActive = false;
                    localRemainingSec = 0;
                }
            } else if (isBoardConfirmed) {
                updateRGBPattern("error");
            }
        }
    }

    function startPump() {
        if (!isBoardConfirmed) {
            alert("Pump hardware is not confirmed Online yet. Commands cannot be sent.");
            return;
        }

        let timerInput = document.getElementById("timer-input");
        let timerValue = parseInt(timerInput.value, 10);

        if (isNaN(timerValue) || timerValue <= 0) {
            alert("Please enter a valid timer duration (1 to 60 minutes) before starting.");
            return;
        }

        timerValue = Math.min(60, Math.max(1, timerValue));
        timerInput.value = timerValue;

        const timerMessage = new Paho.MQTT.Message(timerValue.toString());
        timerMessage.destinationName = TOPIC_TIMER_SET;
        timerMessage.qos = 0;
        timerMessage.retained = true;
        client.send(timerMessage);

        const switchMessage = new Paho.MQTT.Message("ON");
        switchMessage.destinationName = TOPIC_SWITCH;
        switchMessage.qos = 0;
        client.send(switchMessage);

        localPumpActive = true;
        localRemainingSec = timerValue * 60;
        localSetMin = timerValue;
        lastLocalTickMs = performance.now();
        renderRunningState(localRemainingSec, localSetMin);
    }

    function stopPump() {
        if (!isBoardConfirmed) {
            alert("Pump hardware is not confirmed Online yet.");
            return;
        }

        const message = new Paho.MQTT.Message("OFF");
        message.destinationName = TOPIC_SWITCH;
        message.qos = 0;
        client.send(message);

        renderIdleState();
    }
</script>
