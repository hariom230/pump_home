<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Water Level Pump Control Dashboard</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 480px; background: #1e293b; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h2 { text-align: center; margin-top: 0; color: #38bdf8; }
    .status-card { text-align: center; padding: 20px; border-radius: 12px; margin-bottom: 20px; background: #334155; transition: background 0.3s ease; }
    .status-card.off { border-left: 8px solid #ef4444; }
    .status-card.on { border-left: 8px solid #22c55e; background: #14532d; }
    .status-title { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: #94a3b8; }
    .status-value { font-size: 28px; font-weight: bold; margin: 8px 0; }
    .telemetry-value { font-size: 16px; color: #38bdf8; margin-top: 5px; }
    .input-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-size: 14px; color: #cbd5e1; }
    input[type="number"] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 16px; outline: none; }
    .btn-group { display: flex; gap: 10px; }
    button { flex: 1; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: opacity 0.2s; }
    button:active { opacity: 0.8; }
    .btn-start { background: #22c55e; color: #fff; }
    .btn-stop { background: #ef4444; color: #fff; }
    .broker-badge { font-size: 12px; text-align: center; color: #64748b; margin-top: 15px; }
  </style>
</head>
<body>

<div class="container">
  <h2>Pump Controller</h2>

  <div id="statusCard" class="status-card off">
    <div class="status-title">Pump Status</div>
    <div id="pumpStatus" class="status-value">OFF</div>
    <div id="telemetryState" class="telemetry-value">Disconnected / Idle</div>
  </div>

  <div class="input-group">
    <label for="timerInput">Run Duration (1 to 60 Minutes):</label>
    <input type="number" id="timerInput" min="1" max="60" value="10">
  </div>

  <div class="btn-group">
    <button class="btn-start" onclick="startPump()">START PUMP</button>
    <button class="btn-stop" onclick="stopPump()">STOP PUMP</button>
  </div>

  <div id="brokerStatus" class="broker-badge">Connecting to MQTT Broker...</div>
</div>

<script>
  const MQTT_HOST = "broker.hivemq.com";
  const MQTT_PORT = 8000; // WebSocket Port
  const CLIENT_ID = "web_dashboard_" + Math.random().toString(16).substr(2, 8);

  const TOPIC_SWITCH    = "hrx_ml_bsp_wlvl_9482/node_esp8266/io_exec_switch";
  const TOPIC_TIMER_SET = "hrx_ml_bsp_wlvl_9482/node_esp8266/config_runtime_min";
  const TOPIC_TELEMETRY = "hrx_ml_bsp_wlvl_9482/node_esp8266/telemetry_runtime_state";

  const client = new Paho.MQTT.Client(MQTT_HOST, MQTT_PORT, CLIENT_ID);

  client.onConnectionLost = function (responseObject) {
    document.getElementById("brokerStatus").innerText = "Broker Disconnected. Retrying...";
    setTimeout(connectBroker, 3000);
  };

  client.onMessageArrived = function (message) {
    const topic = message.destinationName;
    const payload = message.payloadString;

    if (topic === TOPIC_SWITCH) {
      if (payload === "0" || payload === "OFF") {
        setPumpUI(false, "Pump Suspended / OFF");
      } else if (payload === "1" || payload === "ON") {
        setPumpUI(true, "Pump Active");
      }
    } 
    else if (topic === TOPIC_TELEMETRY) {
      if (payload === "OFF" || payload === "Idle") {
        setPumpUI(false, "Pump Idle");
      } else {
        setPumpUI(true, payload);
      }
    }
  };

  function connectBroker() {
    client.connect({
      onSuccess: function () {
        document.getElementById("brokerStatus").innerText = "Connected to HiveMQ Broker";
        client.subscribe(TOPIC_SWITCH);
        client.subscribe(TOPIC_TELEMETRY);
      },
      onFailure: function () {
        document.getElementById("brokerStatus").innerText = "Connection Failed. Retrying...";
        setTimeout(connectBroker, 3000);
      }
    });
  }

  function setPumpUI(isRunning, telemetryText) {
    const card = document.getElementById("statusCard");
    const statusText = document.getElementById("pumpStatus");
    const telemetryTextEl = document.getElementById("telemetryState");

    if (isRunning) {
      card.className = "status-card on";
      statusText.innerText = "RUNNING";
    } else {
      card.className = "status-card off";
      statusText.innerText = "OFF";
    }
    telemetryTextEl.innerText = telemetryText;
  }

  function startPump() {
    let minutes = parseInt(document.getElementById("timerInput").value);
    if (isNaN(minutes) || minutes < 1) minutes = 1;
    if (minutes > 60) minutes = 60;

    let msgTimer = new Paho.MQTT.Message(minutes.toString());
    msgTimer.destinationName = TOPIC_TIMER_SET;
    client.send(msgTimer);

    let msgSwitch = new Paho.MQTT.Message("1");
    msgSwitch.destinationName = TOPIC_SWITCH;
    msgSwitch.retained = true;
    client.send(msgSwitch);
  }

  function stopPump() {
    let msgSwitch = new Paho.MQTT.Message("0");
    msgSwitch.destinationName = TOPIC_SWITCH;
    msgSwitch.retained = true;
    client.send(msgSwitch);
  }

  connectBroker();
</script>

</body>
</html>
